name: Cleanup generated artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove disposable local outputs
        shell: pwsh
        run: ./build/Cleanup-LocalProjectArtifacts.ps1
