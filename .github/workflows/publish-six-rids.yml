name: Cross-platform publish matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-2025-vs2026
            rid: win-x64
          - runner: windows-2022
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-26.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-26.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-26-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: macos-26
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained bundle
        run: dotnet publish src/DoNotPanicPortfolioVisualizer.App/DoNotPanicPortfolioVisualizer.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: dnppv2-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
