name: Cross-platform publish matrix

# Serialize complete matrix runs so queued lanes and their evidence review
# finish before another matrix is admitted.
concurrency:
  group: dnppv2-complete-matrix
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Real-product soak duration; locked to 10 minutes while migration CRs remain open'
        required: true
        default: '10'
        type: choice
        options: ['10']

permissions:
  contents: read

env:
  EXPECTED_LANE_COUNT: '21'

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository gate configuration
        shell: pwsh
        run: ./build/Test-WorkflowGateConfiguration.ps1

  publish:
    needs: gate
    timeout-minutes: 30
    concurrency:
      group: dnppv2-publish-${{ github.event_name }}-${{ github.ref }}-${{ matrix.runner }}-${{ matrix.rid }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-2025-vs2026
            rid: win-x64
          - runner: windows-2022
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-slim
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-26.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-26.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-26-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: macos-26
            rid: osx-arm64
          - runner: macos-latest
            rid: osx-arm64
          - runner: xcode-27
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained bundle
        run: dotnet publish src/DoNotPanicPortfolioVisualizer.App/DoNotPanicPortfolioVisualizer.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: dnppv2-${{ matrix.runner }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

  real-product-soak:
    needs: gate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes == '10')
    timeout-minutes: 180
    concurrency:
      group: dnppv2-real-product-soak-${{ matrix.runner }}-${{ matrix.rid }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-2025-vs2026
            rid: win-x64
          - runner: windows-2022
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-slim
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-26.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-26.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-26-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: macos-26
            rid: osx-arm64
          - runner: macos-latest
            rid: osx-arm64
          - runner: xcode-27
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    env:
      DNPPV_SOAK_REQUIRE_AI_NEWS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate and mask soak credentials
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DNPPV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY_CODING: ${{ secrets.NVIDIA_API_KEY_CODING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENROUTER_API_KEY)) { throw 'OPENROUTER_API_KEY is required for hosted product soak.' }
          if ([string]::IsNullOrWhiteSpace($env:NVIDIA_API_KEY_CODING)) { throw 'NVIDIA_API_KEY_CODING is required for hosted artifact review.' }
          Write-Host "::add-mask::$env:OPENROUTER_API_KEY"
          Write-Host "::add-mask::$env:DNPPV_OPENROUTER_API_KEY"
          Write-Host "::add-mask::$env:NVIDIA_API_KEY_CODING"
      - name: Build and test the real product
        run: |
          dotnet build DoNotPanicPortfolioVisualizer.sln --configuration Release
          dotnet test DoNotPanicPortfolioVisualizer.sln --configuration Release --no-build --logger "console;verbosity=minimal"
      - name: Publish the real product
        run: dotnet publish src/DoNotPanicPortfolioVisualizer.App/DoNotPanicPortfolioVisualizer.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - name: Start Xvfb for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/dnppv2-xvfb.pid"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Initialize lane closure receipt before soak
        if: always()
        shell: pwsh
        run: |
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, '${{ matrix.rid }}')
           $reviewRoot = Join-Path $PWD ('build/nvidia-review/soak-{0}-{1}' -f $env:GITHUB_RUN_ID, $runnerName)
           New-Item -ItemType Directory -Force -Path $artifactRoot, $reviewRoot | Out-Null
           $receipt = [ordered]@{
             schema = 'dnppv2-lane-closure-record/v1'
             runId = [string]$env:GITHUB_RUN_ID
             runner = $runnerName
             rid = '${{ matrix.rid }}'
             status = 'soak-failed-or-cancelled'
             failure = 'Soak result not yet available.'
             inspectedEvidenceRetained = $false
             result = [ordered]@{ path = 'soak-result.json'; sha256 = $null; outcome = 'Missing'; processCleanedUp = $false }
             rssAiEvidence = [ordered]@{ path = 'news-evidence.json'; sha256 = $null; inspected = $false }
             aiEvidence = [ordered]@{ aiRequestObserved = $false; aiSuccessObserved = $false }
             screenshots = @()
             circularTraces = @()
             review = [ordered]@{ path = 'build/nvidia-review/harness-output.txt'; sha256 = $null; nonEmpty = $false; complete = $false }
           }
           $receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $reviewRoot 'lane-closure-record.json') -Encoding utf8
      - name: Run real-product soak and collect circular trace
        shell: pwsh
        env:
          DNPPV_SOAK_DURATION_MINUTES: ${{ inputs.soak_minutes || '10' }}
          DNPPV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MATRIX_RID: ${{ matrix.rid }}
        run: |
           Write-Host "::add-mask::$env:OPENROUTER_API_KEY"
           Write-Host "::add-mask::$env:DNPPV_OPENROUTER_API_KEY"
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, $env:MATRIX_RID)
           $screenshotPath = Join-Path $artifactRoot 'screenshots'
           $exeName = if ($IsWindows) { 'DoNotPanicPortfolioVisualizer.App.exe' } else { 'DoNotPanicPortfolioVisualizer.App' }
           $exe = Join-Path $PWD ('artifacts/{0}/{1}' -f $env:MATRIX_RID, $exeName)
           ./build/Invoke-ProductSoak.ps1 -ExecutablePath $exe -DurationMinutes ([int]$env:DNPPV_SOAK_DURATION_MINUTES) -ArtifactRoot $artifactRoot -ScreenshotPath $screenshotPath -ScreenshotIntervalMinutes 30
           $screenshots = @(Get-ChildItem -LiteralPath $screenshotPath -Filter '*.png' -File -ErrorAction SilentlyContinue)
           $expectedScreenshotCount = [Math]::Floor((([int]$env:DNPPV_SOAK_DURATION_MINUTES * 60) - 30) / 1800) + 1
           if ($screenshots.Count -lt $expectedScreenshotCount) { throw "Expected at least $expectedScreenshotCount settled screenshots, found $($screenshots.Count)." }
           $tracePaths = @(
             (Join-Path $artifactRoot 'trace/trace.circular.log'),
             (Join-Path $artifactRoot 'trace/yfinance.circular.log')
           )
           foreach ($tracePath in $tracePaths) {
             if (-not (Test-Path -LiteralPath $tracePath -PathType Leaf)) { throw "Required circular trace is missing: $tracePath" }
           }
           $trace = ($tracePaths | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join "`n"
           $rssUsable = $trace -match 'event=RssPlaybackReady\s*/\s*state=(Fresh|Partial)\s*/\s*headline_count=[1-9][0-9]*'
           $aiRequested = $trace -match '\bevent=AiSummaryRequestStarted(?:\s|\||$)'
           $aiSucceeded = $trace -match '\bevent=AiSummarySucceeded(?:\s|\||$)'
           $rssPublished = $trace -match 'NEWS_PLAYBACK_PUBLISHED;SOURCE=RSS;HEADLINE_COUNT=[1-9][0-9]*'
           $newsEvidence = [ordered]@{
             schema = 'dnppv2-hosted-soak-news-evidence/v1'
             runner = $runnerName
             rssUsable = [bool]$rssUsable
             rssPublished = [bool]$rssPublished
             aiRequired = $true
             aiRequestObserved = [bool]$aiRequested
             aiSuccessObserved = [bool]$aiSucceeded
             failure = if (-not $rssUsable) { 'RSS evidence incomplete' } elseif (-not $rssPublished) { 'RSS playback evidence incomplete' } elseif (-not $aiRequested -or -not $aiSucceeded) { 'AI evidence incomplete' } else { $null }
             traceFiles = @('trace/trace.circular.log', 'trace/yfinance.circular.log')
           }
           $newsEvidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $artifactRoot 'news-evidence.json') -Encoding utf8
           if (-not $rssUsable -or -not $rssPublished) { Write-Warning "Hosted soak RSS evidence incomplete on $runnerName; retaining the failure in news-evidence.json." }
           if (-not $aiRequested -or -not $aiSucceeded) { Write-Warning "Hosted soak AI evidence incomplete on $runnerName; retaining the failure in news-evidence.json." }
           foreach ($tracePath in $tracePaths) {
             $traceText = Get-Content -LiteralPath $tracePath -Raw
             foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
               $traceText = $traceText.Replace($secret, '[REDACTED]')
             }
              $traceText = $traceText -replace '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=]\s*)[^\s,;&]+', '$1[REDACTED]'
              foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
                if ($traceText.Contains($secret)) { throw "Secret redaction verification failed for $tracePath." }
              }
              Set-Content -LiteralPath $tracePath -Value $traceText -Encoding utf8
           }
           $manifest = Join-Path $artifactRoot 'evidence-review-input.txt'
           $manifestText = @(
             "run_id=$env:GITHUB_RUN_ID"
             "runner=$runnerName"
             "rid=${{ matrix.rid }}"
             (Get-Content -Raw (Join-Path $artifactRoot 'soak-result.json'))
             "screenshot=$screenshotPath"
             "expected_screenshot_count=$expectedScreenshotCount"
             (Get-Content -Raw (Join-Path $artifactRoot 'news-evidence.json'))
             'screenshots:'
             ($screenshots | Sort-Object Name | ForEach-Object {
                 $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                 "screenshot_file=$($_.Name);bytes=$($_.Length);sha256=$hash"
             })
             'trace_files:'
             (Get-ChildItem -LiteralPath (Join-Path $artifactRoot 'trace') -File -ErrorAction SilentlyContinue | ForEach-Object {
                 $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                 $content = [IO.File]::ReadAllText($_.FullName)
                 $excerpt = if ($content.Length -le 40000) { $content } else { $content.Substring(0, 20000) + "`n[TRACE_EXCERPT_OMITTED]`n" + $content.Substring($content.Length - 20000) }
                 "trace_file=$($_.Name);bytes=$($_.Length);sha256=$hash`n$excerpt"
             })
           ) -join "`n"
           foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
             $manifestText = $manifestText.Replace($secret, '[REDACTED]')
           }
            $manifestText = $manifestText -replace '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=]\s*)[^\s,;&]+', '$1[REDACTED]'
            foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
              if ($manifestText.Contains($secret)) { throw "Secret redaction verification failed for $manifest." }
            }
            Set-Content -LiteralPath $manifest -Value $manifestText -Encoding utf8
      - name: Initialize lane closure receipt after soak
        if: always()
        shell: pwsh
        run: |
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, '${{ matrix.rid }}')
           $reviewRoot = Join-Path $PWD ('build/nvidia-review/soak-{0}-{1}' -f $env:GITHUB_RUN_ID, $runnerName)
           New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
           New-Item -ItemType Directory -Force -Path $reviewRoot | Out-Null
           $hasResult = Test-Path -LiteralPath (Join-Path $artifactRoot 'soak-result.json') -PathType Leaf
           $result = if ($hasResult) { Get-Content -LiteralPath (Join-Path $artifactRoot 'soak-result.json') -Raw | ConvertFrom-Json } else { $null }
           $soakPassed = $hasResult -and $result.outcome -eq 'Passed'
           $receipt = [ordered]@{
             schema = 'dnppv2-lane-closure-record/v1'
             runId = [string]$env:GITHUB_RUN_ID
             runner = $runnerName
             rid = '${{ matrix.rid }}'
             status = if ($soakPassed) { 'review-pending' } else { 'soak-failed-or-cancelled' }
             failure = if ($soakPassed) { $null } elseif ($hasResult) { [string]$result.failure } else { 'soak-result-missing-after-cancellation' }
             inspectedEvidenceRetained = $false
             result = [ordered]@{ path = 'soak-result.json'; outcome = if ($hasResult) { [string]$result.outcome } else { 'Missing' }; processCleanedUp = if ($hasResult) { [bool]$result.processCleanedUp } else { $false } }
             aiEvidence = [ordered]@{ aiRequestObserved = $false; aiSuccessObserved = $false }
             review = [ordered]@{ nonEmpty = $false; complete = $false }
           }
           $receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $reviewRoot 'lane-closure-record.json') -Encoding utf8
      - name: Review soak evidence
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DNPPV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY_CODING: ${{ secrets.NVIDIA_API_KEY_CODING }}
          MATRIX_RID: ${{ matrix.rid }}
        run: |
           Write-Host "::add-mask::$env:NVIDIA_API_KEY_CODING"
           Write-Host "::add-mask::$env:OPENROUTER_API_KEY"
           Write-Host "::add-mask::$env:DNPPV_OPENROUTER_API_KEY"
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, $env:MATRIX_RID)
           $manifest = Join-Path $artifactRoot 'evidence-review-input.txt'
           if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "Soak evidence manifest is missing: $manifest" }
           $reviewRoot = Join-Path $PWD ('build/nvidia-review/soak-{0}-{1}' -f $env:GITHUB_RUN_ID, $runnerName)
           New-Item -ItemType Directory -Force -Path $reviewRoot | Out-Null
           $reviewLog = Join-Path $reviewRoot 'harness-output.txt'
           ./build/Invoke-NvidiaReviewHarness.ps1 -ReviewType TEST_ARTIFACT -ReviewMaterialPath $manifest -OutputDirectory $reviewRoot -RequestTimeoutSeconds 7200 *> $reviewLog
           $reviewExitCode = $LASTEXITCODE
           $safeOutput = Get-Content -LiteralPath $reviewLog -Raw -ErrorAction SilentlyContinue
           if (-not [string]::IsNullOrWhiteSpace($safeOutput)) {
             foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
               $safeOutput = $safeOutput.Replace($secret, '[REDACTED]')
             }
              $safeOutput = $safeOutput -replace '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=]\s*)[^\s,;&]+', '$1[REDACTED]'
              foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
                if ($safeOutput.Contains($secret)) { throw "Secret redaction verification failed for $reviewLog." }
              }
             Set-Content -LiteralPath $reviewLog -Value $safeOutput -Encoding utf8
           }
           if ($null -ne $reviewExitCode -and $reviewExitCode -ne 0) { throw "NVIDIA artifact review returned exit code $reviewExitCode." }
      - name: Inspect and retain lane closure evidence
        if: always()
        shell: pwsh
        env:
          MATRIX_RID: ${{ matrix.rid }}
        run: |
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, $env:MATRIX_RID)
           $reviewRoot = Join-Path $PWD ('build/nvidia-review/soak-{0}-{1}' -f $env:GITHUB_RUN_ID, $runnerName)
           $resultPath = Join-Path $artifactRoot 'soak-result.json'
           $newsPath = Join-Path $artifactRoot 'news-evidence.json'
           $manifestPath = Join-Path $artifactRoot 'evidence-review-input.txt'
           $reviewLog = Join-Path $reviewRoot 'harness-output.txt'
           $failures = [Collections.Generic.List[string]]::new()
           $result = $null
           if (Test-Path -LiteralPath $resultPath -PathType Leaf) {
             try { $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json } catch { $failures.Add("Unreadable soak result: $resultPath") }
           } else { $failures.Add("Required inspected evidence is missing: $resultPath") }
           foreach ($requiredPath in @($newsPath, $manifestPath, $reviewLog)) {
             if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) { $failures.Add("Required inspected evidence is missing: $requiredPath") }
           }
           if ($null -ne $result -and $result.outcome -ne 'Passed') { $failures.Add("Lane result is not Passed: $runnerName") }
           if ($null -ne $result -and $result.processCleanedUp -ne $true) { $failures.Add("Lane cleanup was not proven: $runnerName") }
           $screenshots = @(Get-ChildItem -LiteralPath (Join-Path $artifactRoot 'screenshots') -Filter '*.png' -File -ErrorAction SilentlyContinue)
           if ($screenshots.Count -lt 1) { $failures.Add("Settled visual evidence is missing: $runnerName") }
           $news = $null
           if (Test-Path -LiteralPath $newsPath -PathType Leaf) {
             try { $news = Get-Content -LiteralPath $newsPath -Raw | ConvertFrom-Json } catch { $failures.Add("Unreadable news evidence: $newsPath") }
           }
           $aiRequested = $null -ne $news -and [bool]$news.aiRequestObserved
           $aiSucceeded = $null -ne $news -and [bool]$news.aiSuccessObserved
           $tracePaths = @(
             (Join-Path $artifactRoot 'trace/trace.circular.log'),
             (Join-Path $artifactRoot 'trace/yfinance.circular.log')
           )
           foreach ($tracePath in $tracePaths) {
             if (-not (Test-Path -LiteralPath $tracePath -PathType Leaf)) { $failures.Add("Required circular trace is missing: $tracePath") }
           }
           $reviewText = if (Test-Path -LiteralPath $reviewLog -PathType Leaf) { Get-Content -LiteralPath $reviewLog -Raw } else { '' }
           if ([string]::IsNullOrWhiteSpace($reviewText)) { $failures.Add("NVIDIA review output is empty: $reviewLog") }
           $resultOutcome = if ($null -ne $result) { [string]$result.outcome } else { 'Missing' }
           $resultCleanup = $null -ne $result -and [bool]$result.processCleanedUp
           $aiFailure = if ($aiSucceeded) { $null } else { 'AI evidence incomplete: aiRequestObserved={0}; aiSuccessObserved={1}' -f $aiRequested, $aiSucceeded }
           $recordStatus = if ($failures.Count -eq 0) { 'complete' } elseif ($resultOutcome -eq 'Passed') { 'review-incomplete' } else { 'soak-failed-or-cancelled' }
           $recordFailureParts = @($failures | ForEach-Object { [string]$_ })
           if ($null -ne $aiFailure) { $recordFailureParts += $aiFailure }
           $recordFailure = if ($recordFailureParts.Count -eq 0) { $null } else { $recordFailureParts -join '; ' }
            $record = [ordered]@{
              schema = 'dnppv2-lane-closure-record/v1'
             runId = [string]$env:GITHUB_RUN_ID
             runner = $runnerName
             rid = [string]$env:MATRIX_RID
             inspectedUtc = [DateTimeOffset]::UtcNow.ToString('O')
             result = [ordered]@{
               path = 'soak-result.json'
               sha256 = if (Test-Path -LiteralPath $resultPath -PathType Leaf) { (Get-FileHash -LiteralPath $resultPath -Algorithm SHA256).Hash } else { $null }
               outcome = $resultOutcome
               processCleanedUp = $resultCleanup
             }
             rssAiEvidence = [ordered]@{
               path = 'news-evidence.json'
               sha256 = if (Test-Path -LiteralPath $newsPath -PathType Leaf) { (Get-FileHash -LiteralPath $newsPath -Algorithm SHA256).Hash } else { $null }
               inspected = Test-Path -LiteralPath $newsPath -PathType Leaf
             }
             aiEvidence = [ordered]@{
               aiRequestObserved = $aiRequested
               aiSuccessObserved = $aiSucceeded
             }
             screenshots = @($screenshots | Sort-Object Name | ForEach-Object {
               [ordered]@{ path = "screenshots/$($_.Name)"; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
             })
             circularTraces = @($tracePaths | ForEach-Object {
               if (Test-Path -LiteralPath $_ -PathType Leaf) {
                 $trace = Get-Item -LiteralPath $_
                 [ordered]@{ path = "trace/$($trace.Name)"; bytes = $trace.Length; sha256 = (Get-FileHash -LiteralPath $trace.FullName -Algorithm SHA256).Hash }
               }
             })
             review = [ordered]@{
               path = "build/nvidia-review/soak-$env:GITHUB_RUN_ID-$runnerName/harness-output.txt"
               sha256 = if (Test-Path -LiteralPath $reviewLog -PathType Leaf) { (Get-FileHash -LiteralPath $reviewLog -Algorithm SHA256).Hash } else { $null }
                nonEmpty = -not [string]::IsNullOrWhiteSpace($reviewText)
                complete = $failures.Count -eq 0
             }
             status = $recordStatus
             failure = $recordFailure
             inspectedEvidenceRetained = $failures.Count -eq 0
           }
           $record | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $reviewRoot 'lane-closure-record.json') -Encoding utf8
           if ($failures.Count -gt 0) { Write-Warning "Lane evidence inspection failed for ${runnerName}: $recordFailure" }
      - name: Stop Xvfb
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/dnppv2-xvfb.pid" ]; then kill "$(cat "$RUNNER_TEMP/dnppv2-xvfb.pid")" 2>/dev/null || true; fi
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnppv2-soak-${{ github.run_id }}-${{ matrix.runner }}-${{ matrix.rid }}
          path: |
            artifacts/soak
            build/nvidia-review

  post-soak-review:
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes == '10'))
    needs: real-product-soak
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Wait one minute for artifact publication
        shell: bash
        run: sleep 60
      - name: Retrieve this run's soak evidence
        uses: actions/download-artifact@v4
        with:
          pattern: dnppv2-soak-${{ github.run_id }}-*
          path: post-soak-evidence
          merge-multiple: false
      - name: Review every runner's traces and evidence
        shell: pwsh
        env:
          NVIDIA_API_KEY_CODING: ${{ secrets.NVIDIA_API_KEY_CODING }}
        run: |
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          if ([string]::IsNullOrWhiteSpace($env:NVIDIA_API_KEY_CODING)) { throw 'NVIDIA_API_KEY_CODING is required for post-soak artifact review.' }
          Write-Host "::add-mask::$env:NVIDIA_API_KEY_CODING"
          $expectedLaneCount = [int]$env:EXPECTED_LANE_COUNT
          $manifests = @(Get-ChildItem -LiteralPath post-soak-evidence -Recurse -Filter 'evidence-review-input.txt' -File)
          $failures = [Collections.Generic.List[string]]::new()
          $actualArtifacts = @($manifests | ForEach-Object { $_.Directory.Parent.Parent.Name })
           if ($manifests.Count -ne $expectedLaneCount) {
             New-Item -ItemType Directory -Force -Path build/nvidia-review | Out-Null
             "Expected $expectedLaneCount soak evidence manifests, found $($manifests.Count)." | Set-Content -LiteralPath build/nvidia-review/defect-candidates.txt -Encoding utf8
             throw "Expected $expectedLaneCount soak evidence manifests, found $($manifests.Count)."
           }
           $closureRecords = @(Get-ChildItem -LiteralPath post-soak-evidence -Recurse -Filter 'lane-closure-record.json' -File)
           if ($closureRecords.Count -ne $expectedLaneCount) {
             $failures.Add("Expected $expectedLaneCount inspected lane closure records, found $($closureRecords.Count).")
           }
           foreach ($closureRecordPath in $closureRecords) {
             try {
               $closureRecord = Get-Content -LiteralPath $closureRecordPath.FullName -Raw | ConvertFrom-Json
               if ($closureRecord.schema -ne 'dnppv2-lane-closure-record/v1' -or
                   $closureRecord.status -ne 'complete' -or
                   $closureRecord.inspectedEvidenceRetained -ne $true -or
                   $closureRecord.result.outcome -ne 'Passed' -or
                   $closureRecord.result.processCleanedUp -ne $true -or
                   @($closureRecord.screenshots).Count -lt 1 -or
                   @($closureRecord.circularTraces).Count -ne 2 -or
                   $closureRecord.review.nonEmpty -ne $true -or
                   $closureRecord.review.complete -ne $true -or
                   $closureRecord.aiEvidence.aiSuccessObserved -ne $true) {
                 $failures.Add("Incomplete inspected lane closure record: $($closureRecordPath.FullName)")
               }
             }
             catch {
               $failures.Add("Unreadable inspected lane closure record: $($closureRecordPath.FullName)")
             }
           }
           if ($actualArtifacts.Count -ne @($actualArtifacts | Sort-Object -Unique).Count) {
            $failures.Add('Hosted soak artifact inventory contains duplicate artifact directories.')
          }
          if ($manifests.Count -eq 0) {
            $failures.Add('No hosted soak evidence manifests were downloaded.')
          }
          $reviewScript = Join-Path $env:GITHUB_WORKSPACE 'build/Invoke-NvidiaReviewHarness.ps1'
          if (-not (Test-Path -LiteralPath $reviewScript -PathType Leaf)) {
            throw "NVIDIA review harness script not found: $reviewScript"
          }
          $reviewDirectories = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $runnerRidPairs = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($manifest in $manifests | Sort-Object FullName) {
            $material = Get-Content -LiteralPath $manifest.FullName -Raw
            $manifestValid = $true
            foreach ($traceName in @('trace.circular.log', 'yfinance.circular.log')) {
              if ($material -notmatch [regex]::Escape("trace_file=$traceName;")) {
                $failures.Add("Required circular trace evidence is absent: $traceName in $($manifest.FullName)")
                $manifestValid = $false
              }
            }
            if ($material -notmatch 'Ai(?:Summary|AccessValidation)') {
              $failures.Add("AI trace evidence is absent: $($manifest.FullName)")
              $manifestValid = $false
            }
            foreach ($requiredEvidenceFile in @('soak-result.json', 'news-evidence.json')) {
              $requiredEvidencePath = Join-Path $manifest.Directory.FullName $requiredEvidenceFile
              if (-not (Test-Path -LiteralPath $requiredEvidencePath -PathType Leaf)) {
                $failures.Add("Required soak evidence file is absent: $requiredEvidencePath")
                $manifestValid = $false
              }
            }
            $runnerMatch = [regex]::Match($material, '(?m)^runner=(?<runner>[^\r\n]+)$')
            $ridMatch = [regex]::Match($material, '(?m)^rid=(?<rid>[^\r\n]+)$')
            if (-not $runnerMatch.Success -or -not $ridMatch.Success) {
              $failures.Add("Runner/RID identity is absent from $($manifest.FullName)")
              $manifestValid = $false
            }
            $artifactDirectory = $manifest.Directory.Parent.Parent.Name
            if (-not $reviewDirectories.Add($artifactDirectory)) {
              $failures.Add("Duplicate hosted soak review directory key: $artifactDirectory")
            }
            if ($runnerMatch.Success -and $ridMatch.Success -and
                -not $runnerRidPairs.Add("$($runnerMatch.Groups['runner'].Value)|$($ridMatch.Groups['rid'].Value)")) {
              $failures.Add("Duplicate hosted soak runner/RID pair in $($manifest.FullName)")
            }
            $reviewRoot = Join-Path $PWD ('build/nvidia-review/post-soak-{0}' -f $artifactDirectory)
            New-Item -ItemType Directory -Force -Path $reviewRoot | Out-Null
            $reviewLog = Join-Path $reviewRoot 'harness-output.txt'
            try {
              & $reviewScript -ReviewType TEST_ARTIFACT -ReviewMaterialPath $manifest.FullName -OutputDirectory $reviewRoot -RequestTimeoutSeconds 7200 *> $reviewLog
              $reviewExitCode = $LASTEXITCODE
              if ($null -ne $reviewExitCode -and $reviewExitCode -ne 0) {
                throw "Reviewer process returned exit code $reviewExitCode."
              }
              $safeOutput = Get-Content -LiteralPath $reviewLog -Raw -ErrorAction SilentlyContinue
              if (-not [string]::IsNullOrWhiteSpace($safeOutput)) {
                if (-not [string]::IsNullOrWhiteSpace($env:NVIDIA_API_KEY_CODING)) {
                  $safeOutput = $safeOutput.Replace($env:NVIDIA_API_KEY_CODING, '[REDACTED]')
                }
                $safeOutput = $safeOutput -replace '(?i)(api[-_]?key|authorization|bearer|password|token)\s*[=:]\s*[^\s,;]+', '$1=[REDACTED]'
                Set-Content -LiteralPath $reviewLog -Value $safeOutput -Encoding utf8
              }
            }
            catch {
              $safeMessage = [string]$_.Exception.Message
              if (-not [string]::IsNullOrWhiteSpace($env:NVIDIA_API_KEY_CODING)) {
                $safeMessage = $safeMessage.Replace($env:NVIDIA_API_KEY_CODING, '[REDACTED]')
              }
              $safeMessage = $safeMessage -replace '(?i)(api[-_]?key|authorization|bearer|password|token)\s*[=:]\s*[^\s,;]+', '$1=[REDACTED]'
              $failures.Add("NVIDIA artifact review failed for ${artifactDirectory}: $safeMessage")
            }
          }
          if ($failures.Count -gt 0) {
            New-Item -ItemType Directory -Force -Path build/nvidia-review | Out-Null
            $failures | Set-Content -LiteralPath build/nvidia-review/defect-candidates.txt -Encoding utf8
            throw ($failures -join "`n")
          }
      - name: Upload post-soak review and defect candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnppv2-post-soak-review-${{ github.run_id }}
          path: build/nvidia-review
