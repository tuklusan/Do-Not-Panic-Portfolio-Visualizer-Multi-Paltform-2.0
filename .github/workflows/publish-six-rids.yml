name: Cross-platform publish matrix

# Serialize complete matrix runs so queued lanes and their evidence review
# finish before another matrix is admitted.
concurrency:
  group: dnppv2-complete-matrix
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Real-product soak duration; locked to 10 minutes while migration CRs remain open'
        required: true
        default: '10'
        type: choice
        options: ['10']
      review_wait_policy:
        description: 'Reviewer wait policy; use one-time-slow-review only with explicit operator authorization'
        required: true
        default: 'bounded-30m'
        type: choice
        options: ['bounded-30m', 'one-time-slow-review']
      evidence_mode:
        description: 'Use a fresh matrix, or reprocess one completed matrix for instrumentation-only corrections'
        required: true
        default: 'fresh-matrix'
        type: choice
        options: ['fresh-matrix', 'reuse-completed-run']
      prior_run_id:
        description: 'Required completed matrix run ID when evidence_mode is reuse-completed-run'
        required: false
        type: string
      prior_commit_sha:
        description: 'Required commit SHA of the completed matrix when evidence_mode is reuse-completed-run'
        required: false
        type: string

permissions:
  contents: read

env:
  EXPECTED_LANE_COUNT: '20'
  DNPPV_REVIEWER_ID: dnppv2-nvidia-review-gate-v1
  DNPPV_REVIEW_CADENCE_SECONDS: '30'
  REVIEW_WAIT_POLICY: ${{ inputs.review_wait_policy || 'bounded-30m' }}
  EVIDENCE_MODE: ${{ inputs.evidence_mode || 'fresh-matrix' }}
  PRIOR_RUN_ID: ${{ inputs.prior_run_id || '' }}
  PRIOR_COMMIT_SHA: ${{ inputs.prior_commit_sha || '' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository gate configuration
        shell: pwsh
        run: ./build/Test-WorkflowGateConfiguration.ps1
      - name: Enforce matrix evidence reuse policy
        shell: pwsh
        run: ./build/Test-MatrixEvidenceReusePolicy.ps1 -Mode $env:EVIDENCE_MODE -PriorRunId $env:PRIOR_RUN_ID -PriorCommitSha $env:PRIOR_COMMIT_SHA

  publish:
    needs: gate
    if: needs.gate.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_mode != 'reuse-completed-run')
    timeout-minutes: 30
    concurrency:
      group: dnppv2-publish-${{ github.event_name }}-${{ github.ref }}-${{ matrix.runner }}-${{ matrix.rid }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-2025-vs2026
            rid: win-x64
          - runner: windows-2022
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-26.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-26.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-26-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: macos-26
            rid: osx-arm64
          - runner: macos-latest
            rid: osx-arm64
          - runner: xcode-27
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: matrix.runner != 'windows-11-arm'
        with:
          dotnet-version: '10.0.x'
      - name: Verify .NET on Windows ARM image
        if: matrix.runner == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            throw 'The windows-11-arm image must provide the required .NET SDK because setup-dotnet is incompatible with this runner.'
          }
          dotnet --info
      - name: Publish self-contained bundle
        run: dotnet publish src/DoNotPanicPortfolioVisualizer.App/DoNotPanicPortfolioVisualizer.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: dnppv2-${{ matrix.runner }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

  local-companion-dispatch:
    # LOCAL_COMPANION_DISPATCH is a credential-free handoff to the private lab.
    needs: gate
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes == '10')) && (github.event_name != 'workflow_dispatch' || inputs.evidence_mode != 'reuse-completed-run')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create credential-free local companion request
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/local-companion | Out-Null
          ./build/New-LocalCompanionDispatch.ps1 -RunId $env:GITHUB_RUN_ID -CommitSha $env:GITHUB_SHA -OutputPath artifacts/local-companion/local-companion-dispatch.json
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Validate local companion request
        shell: pwsh
        run: ./build/Test-LocalCompanionDispatch.ps1 -SelfTest
      - name: Validate local companion receipt contract
        shell: pwsh
        run: ./build/Test-LocalCompanionReceipt.ps1 -SelfTest
      - uses: actions/upload-artifact@v4
        with:
          name: dnppv2-local-companion-dispatch-${{ github.run_id }}
          path: artifacts/local-companion/local-companion-dispatch.json

  real-product-soak:
    needs: gate
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes == '10')) && (github.event_name != 'workflow_dispatch' || inputs.evidence_mode != 'reuse-completed-run')
    timeout-minutes: 360
    concurrency:
      group: dnppv2-real-product-soak-${{ matrix.runner }}-${{ matrix.rid }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-2025-vs2026
            rid: win-x64
          - runner: windows-2022
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-26.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-26.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-26-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: macos-26
            rid: osx-arm64
          - runner: macos-latest
            rid: osx-arm64
          - runner: xcode-27
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    env:
      DNPPV_SOAK_REQUIRE_AI_NEWS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate and mask soak credentials
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DNPPV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY_CODING: ${{ secrets.NVIDIA_API_KEY_CODING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENROUTER_API_KEY)) { throw 'OPENROUTER_API_KEY is required for hosted product soak.' }
          if ([string]::IsNullOrWhiteSpace($env:NVIDIA_API_KEY_CODING)) { throw 'NVIDIA_API_KEY_CODING is required for hosted artifact review.' }
          Write-Host "::add-mask::$env:OPENROUTER_API_KEY"
           Write-Host "::add-mask::$env:DNPPV_OPENROUTER_API_KEY"
           Write-Host "::add-mask::$env:NVIDIA_API_KEY_CODING"
           Write-Host 'MASKING_VERIFIED'
      - uses: actions/setup-dotnet@v4
        if: matrix.runner != 'windows-11-arm'
        with:
          dotnet-version: '10.0.x'
      - name: Verify .NET on Windows ARM image
        if: matrix.runner == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            throw 'The windows-11-arm image must provide the required .NET SDK because setup-dotnet is incompatible with this runner.'
          }
          dotnet --info
      - name: Build and test the real product
        run: |
          dotnet build DoNotPanicPortfolioVisualizer.sln --configuration Release
          dotnet test DoNotPanicPortfolioVisualizer.sln --configuration Release --no-build --logger "console;verbosity=minimal"
      - name: Publish the real product
        run: dotnet publish src/DoNotPanicPortfolioVisualizer.App/DoNotPanicPortfolioVisualizer.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - name: Start Xvfb for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/dnppv2-xvfb.pid"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Initialize lane closure receipt before soak
        if: always()
        shell: pwsh
        run: |
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, '${{ matrix.rid }}')
           $reviewRoot = Join-Path $artifactRoot 'review'
           New-Item -ItemType Directory -Force -Path $artifactRoot, $reviewRoot | Out-Null
           $receipt = [ordered]@{
             schema = 'dnppv2-lane-closure-record/v2'
             runId = [string]$env:GITHUB_RUN_ID
             commitSha = [string]$env:GITHUB_SHA
             runner = $runnerName
             rid = '${{ matrix.rid }}'
             status = 'soak-failed-or-cancelled'
             failure = 'Soak result not yet available.'
             inspectedEvidenceRetained = $false
             result = [ordered]@{ path = 'soak-result.json'; sha256 = $null; outcome = 'Missing'; processCleanedUp = $false }
             rssAiEvidence = [ordered]@{ path = 'news-evidence.json'; sha256 = $null; inspected = $false }
             aiEvidence = [ordered]@{ aiRequestObserved = $false; aiSuccessObserved = $false; failure = $null }
             screenshots = @()
             circularTraces = @()
             review = [ordered]@{ path = 'build/dnppv2-nvidia-review/harness-output.txt'; sha256 = $null; nonEmpty = $false; complete = $false }
           }
           $receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $reviewRoot 'lane-closure-record.pending.json') -Encoding utf8
      - name: Run real-product soak and collect circular trace
        shell: pwsh
        env:
          DNPPV_SOAK_DURATION_MINUTES: ${{ inputs.soak_minutes || '10' }}
          DNPPV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MATRIX_RID: ${{ matrix.rid }}
        run: |
           Write-Host "::add-mask::$env:OPENROUTER_API_KEY"
           Write-Host "::add-mask::$env:DNPPV_OPENROUTER_API_KEY"
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, $env:MATRIX_RID)
           $screenshotPath = Join-Path $artifactRoot 'screenshots'
           $exeName = if ($IsWindows) { 'DoNotPanicPortfolioVisualizer.App.exe' } else { 'DoNotPanicPortfolioVisualizer.App' }
           $exe = Join-Path $PWD ('artifacts/{0}/{1}' -f $env:MATRIX_RID, $exeName)
           ./build/Invoke-ProductSoak.ps1 -ExecutablePath $exe -DurationMinutes ([int]$env:DNPPV_SOAK_DURATION_MINUTES) -ArtifactRoot $artifactRoot -ScreenshotPath $screenshotPath -ScreenshotIntervalMinutes 30
           $screenshots = @(Get-ChildItem -LiteralPath $screenshotPath -Filter '*.png' -File -ErrorAction SilentlyContinue)
             # ProductShellWindow.axaml.cs:153-181 captures after a 30-second
             # settling delay, then every requested interval. Invoke-ProductSoak.ps1
             # passes the requested interval through at lines 86-89.
            $settlingSeconds = 30
            $captureIntervalSeconds = 30 * 60
            $durationSeconds = [int]$env:DNPPV_SOAK_DURATION_MINUTES * 60
            $expectedScreenshotCount = if ($durationSeconds -lt $settlingSeconds) { 0 } else { [Math]::Floor(($durationSeconds - $settlingSeconds) / $captureIntervalSeconds) + 1 }
           if ($screenshots.Count -lt $expectedScreenshotCount) { throw "Expected at least $expectedScreenshotCount settled screenshots, found $($screenshots.Count)." }
           $tracePaths = @(
             (Join-Path $artifactRoot 'trace/trace.circular.log'),
             (Join-Path $artifactRoot 'trace/yfinance.circular.log')
           )
           foreach ($tracePath in $tracePaths) {
             if (-not (Test-Path -LiteralPath $tracePath -PathType Leaf)) { throw "Required circular trace is missing: $tracePath" }
           }
            function Read-CircularTraceText([string]$Path) {
              $bytes = [IO.File]::ReadAllBytes($Path)
              $filtered = [Collections.Generic.List[byte]]::new()
              foreach ($byte in $bytes) { if ($byte -ne 0) { [void]$filtered.Add($byte) } }
              return [Text.Encoding]::UTF8.GetString($filtered.ToArray())
            }
            function Test-ByteSequence([byte[]]$Haystack, [byte[]]$Needle) {
              if ($Needle.Length -eq 0 -or $Needle.Length -gt $Haystack.Length) { return $false }
              for ($offset = 0; $offset -le $Haystack.Length - $Needle.Length; $offset++) {
                $matched = $true
                for ($index = 0; $index -lt $Needle.Length; $index++) {
                  if ($Haystack[$offset + $index] -ne $Needle[$index]) { $matched = $false; break }
                }
                if ($matched) { return $true }
              }
              return $false
            }
            function Test-ByteSequenceIgnoringNul([byte[]]$Haystack, [byte[]]$Needle) {
              $compact = [Collections.Generic.List[byte]]::new()
              foreach ($byte in $Haystack) { if ($byte -ne 0) { [void]$compact.Add($byte) } }
              return Test-ByteSequence $compact.ToArray() $Needle
            }
            $nulSecretProbe = [byte[]](65, 0, 80, 0, 73, 0, 75, 0, 69, 0, 89)
            if (-not (Test-ByteSequenceIgnoringNul $nulSecretProbe ([byte[]](65, 80, 73, 75, 69, 89)))) { throw 'Binary secret scanner self-test failed.' }
            Write-Host 'NUL_SECRET_SCAN_SELF_TEST=Passed'
            # Normalize reviewer material from the complete byte stream while
            # retaining each clean original circular file byte-for-byte. The
            # byte scan below is authoritative; normalized text is never used
            # to decide whether a retained original is safe.
            $normalizedTraceByPath = @{}
            $normalizedTraceByName = @{}
            foreach ($tracePath in $tracePaths) {
              $traceText = Read-CircularTraceText $tracePath
              $normalizedTraceByPath[$tracePath] = $traceText
              $normalizedTraceByName[[IO.Path]::GetFileName($tracePath)] = $traceText
            }
            $trace = ($tracePaths | ForEach-Object { $normalizedTraceByPath[$_] }) -join "`n"
           $rssUsable = $trace -match 'event=RssPlaybackReady\s*(?:\||/)\s*state=(Fresh|Partial)\s*(?:\||/)\s*headline_count=[1-9][0-9]*'
           $rssExternalFailure = $trace -match '(?i)event=RssPlaybackReady\s*(?:\||/)\s*state=Unavailable'
           $aiRequested = $trace -match '\bevent=AiSummaryRequestStarted(?:\s|\||$)'
           $aiSucceeded = $trace -match '\bevent=AiSummarySucceeded(?:\s|\||$)'
           $aiQuotaLimited = $trace -match 'event=AiSummaryResponse[^\r\n]*status_code=4[0-9][0-9]'
           $rssPublished = $trace -match 'NEWS_PLAYBACK_PUBLISHED;SOURCE=RSS;HEADLINE_COUNT=[1-9][0-9]*'
           $newsEvidence = [ordered]@{
             schema = 'dnppv2-hosted-soak-news-evidence/v1'
             runner = $runnerName
             rssUsable = [bool]$rssUsable
             rssExternalFailureDisposition = if ($rssExternalFailure) { 'external-rss-outage-advisory' } else { $null }
             rssPublished = [bool]$rssPublished
             aiRequired = $true
             aiRequestObserved = [bool]$aiRequested
             aiSuccessObserved = [bool]$aiSucceeded
             aiQuotaLimited = [bool]$aiQuotaLimited
             aiExternalFailureDisposition = if ($aiQuotaLimited -and -not $aiSucceeded) { 'provider-quota-rate-limited' } else { $null }
             failure = if (-not $rssUsable -and -not $rssExternalFailure) { 'RSS evidence incomplete' } elseif (-not $rssPublished -and -not $rssExternalFailure) { 'RSS playback evidence incomplete' } elseif (-not $aiRequested) { 'AI evidence incomplete' } elseif (-not $aiSucceeded -and $aiQuotaLimited) { 'provider-quota-rate-limited' } elseif (-not $aiSucceeded) { 'AI evidence incomplete' } else { $null }
             traceFiles = @('trace/trace.circular.log', 'trace/yfinance.circular.log')
           }
           $newsEvidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $artifactRoot 'news-evidence.json') -Encoding utf8
           if ((-not $rssUsable -or -not $rssPublished) -and -not $rssExternalFailure) { Write-Warning "Hosted soak RSS evidence incomplete on $runnerName; retaining the failure in news-evidence.json." }
           if (-not $aiRequested -or -not $aiSucceeded) { Write-Warning "Hosted soak AI evidence incomplete on $runnerName; retaining the failure in news-evidence.json." }
           foreach ($tracePath in $tracePaths) {
              # Preserve clean circular files byte-for-byte. If a credential is
              # detected, quarantine the contaminated file outside the upload
              # root before failing closed; never retain a secret in evidence.
              $originalTraceBytes = [IO.File]::ReadAllBytes($tracePath)
              foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
                $secretBytes = [Text.Encoding]::UTF8.GetBytes($secret)
                if ((Test-ByteSequence $originalTraceBytes $secretBytes) -or
                    (Test-ByteSequenceIgnoringNul $originalTraceBytes $secretBytes) -or
                    $normalizedTraceByPath[$tracePath].Contains($secret)) {
                  $quarantine = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
                  Move-Item -LiteralPath $tracePath -Destination $quarantine -Force
                  throw "Unredacted secret found in original trace; contaminated evidence was quarantined: $tracePath."
                }
              }
              $originalTraceText = $normalizedTraceByPath[$tracePath]
              if ($originalTraceText -match '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=])[^\s,;&]+') {
                $quarantine = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
                Move-Item -LiteralPath $tracePath -Destination $quarantine -Force
                throw "Credential-shaped value found in original trace; contaminated evidence was quarantined: $tracePath."
              }
           }
           $manifest = Join-Path $artifactRoot 'evidence-review-input.txt'
           $manifestText = @(
             "run_id=$env:GITHUB_RUN_ID"
             "commit_sha=$env:GITHUB_SHA"
             "runner=$runnerName"
             "rid=${{ matrix.rid }}"
             (Get-Content -Raw (Join-Path $artifactRoot 'soak-result.json'))
             "screenshot=$screenshotPath"
             "expected_screenshot_count=$expectedScreenshotCount"
             (Get-Content -Raw (Join-Path $artifactRoot 'news-evidence.json'))
             'screenshots:'
             ($screenshots | Sort-Object Name | ForEach-Object {
                 $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                 "screenshot_file=$($_.Name);bytes=$($_.Length);sha256=$hash"
             })
             'trace_files:'
             ($tracePaths | ForEach-Object {
                 $traceFile = Get-Item -LiteralPath $_
                 $hash = (Get-FileHash -LiteralPath $traceFile.FullName -Algorithm SHA256).Hash
                   $content = $normalizedTraceByName[$traceFile.Name]
                   if ($null -eq $content) { throw "Normalized circular trace content is missing: $($traceFile.FullName)" }
                 foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
                   $content = $content.Replace($secret, '[REDACTED]')
                 }
                 $content = $content -replace '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=]\s*)[^\s,;&]+', '$1[REDACTED]'
                 $excerpt = if ($content.Length -le 120000) { $content } else { $content.Substring(0, 60000) + "`n[TRACE_EXCERPT_OMITTED]`n" + $content.Substring($content.Length - 60000) }
                 "trace_file=$($traceFile.Name);bytes=$($traceFile.Length);sha256=$hash`n$excerpt"
             })
           ) -join "`n"
            foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
             $manifestText = $manifestText.Replace($secret, '[REDACTED]')
           }
            $manifestText = $manifestText -replace '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=]\s*)[^\s,;&]+', '$1[REDACTED]'
            foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
              if ($manifestText.Contains($secret)) { throw "Secret redaction verification failed for $manifest." }
            }
            Set-Content -LiteralPath $manifest -Value $manifestText -Encoding utf8
      - name: Initialize lane closure receipt after soak
        if: always()
        shell: pwsh
        run: |
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, '${{ matrix.rid }}')
           $reviewRoot = Join-Path $artifactRoot 'review'
           New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
           New-Item -ItemType Directory -Force -Path $reviewRoot | Out-Null
           $hasResult = Test-Path -LiteralPath (Join-Path $artifactRoot 'soak-result.json') -PathType Leaf
           $result = if ($hasResult) { Get-Content -LiteralPath (Join-Path $artifactRoot 'soak-result.json') -Raw | ConvertFrom-Json } else { $null }
            $newsPath = Join-Path $artifactRoot 'news-evidence.json'
            $newsEvidence = $null
            $newsEvidenceFailure = $null
            if (Test-Path -LiteralPath $newsPath -PathType Leaf) {
              try { $newsEvidence = Get-Content -LiteralPath $newsPath -Raw | ConvertFrom-Json } catch { $newsEvidenceFailure = 'news-evidence.json malformed' }
            } else {
              $newsEvidenceFailure = 'news-evidence.json missing'
            }
           $soakPassed = $hasResult -and $result.outcome -eq 'Passed'
           $receipt = [ordered]@{
             schema = 'dnppv2-lane-closure-record/v2'
             runId = [string]$env:GITHUB_RUN_ID
             commitSha = [string]$env:GITHUB_SHA
             runner = $runnerName
             rid = '${{ matrix.rid }}'
             status = if ($soakPassed) { 'review-pending' } else { 'soak-failed-or-cancelled' }
             failure = if ($soakPassed) { $null } elseif ($hasResult) { [string]$result.failure } else { 'soak-result-missing-after-cancellation' }
             inspectedEvidenceRetained = $false
             result = [ordered]@{ path = 'soak-result.json'; outcome = if ($hasResult) { [string]$result.outcome } else { 'Missing' }; processCleanedUp = if ($hasResult) { [bool]$result.processCleanedUp } else { $false } }
              aiEvidence = [ordered]@{
                 aiRequestObserved = $null -ne $newsEvidence -and [bool]$newsEvidence.aiRequestObserved
                 aiSuccessObserved = $null -ne $newsEvidence -and [bool]$newsEvidence.aiSuccessObserved
                failure = $newsEvidenceFailure
              }
             review = [ordered]@{ nonEmpty = $false; complete = $false }
           }
           $receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $reviewRoot 'lane-closure-record.pending.json') -Encoding utf8
      - name: Review soak evidence
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DNPPV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY_CODING: ${{ secrets.NVIDIA_API_KEY_CODING }}
          CODE_REVIEWER_ENDPOINT: ${{ vars.CODE_REVIEWER_ENDPOINT }}
          CODE_REVIEWER_MODEL: ${{ vars.CODE_REVIEWER_MODEL }}
          CODE_REVIEWER_API_KEY: ${{ secrets.NVIDIA_API_KEY_CODING }}
          CODE_REVIEWER_REQUEST_OVERRIDES_JSON: ${{ vars.CODE_REVIEWER_REQUEST_OVERRIDES_JSON }}
          MATRIX_RID: ${{ matrix.rid }}
        run: |
           Write-Host "::add-mask::$env:NVIDIA_API_KEY_CODING"
           Write-Host "::add-mask::$env:OPENROUTER_API_KEY"
           Write-Host "::add-mask::$env:DNPPV_OPENROUTER_API_KEY"
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, $env:MATRIX_RID)
           $manifest = Join-Path $artifactRoot 'evidence-review-input.txt'
           if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "Soak evidence manifest is missing: $manifest" }
           $reviewRoot = Join-Path $artifactRoot 'review'
           New-Item -ItemType Directory -Force -Path $reviewRoot | Out-Null
           function Quarantine-ReviewerEvidence([string]$Reason) {
             & ./build/Invoke-ReviewerEvidenceQuarantine.ps1 -ReviewRoot $reviewRoot -ArtifactRoot $artifactRoot -RunnerTemp $env:RUNNER_TEMP -RunId $env:GITHUB_RUN_ID -CommitSha $env:GITHUB_SHA -Runner $runnerName -Rid $env:MATRIX_RID -Reason $Reason
           }
           $reviewLog = Join-Path $reviewRoot 'harness-output.txt'
           $reviewTimeoutSeconds = if ($env:REVIEW_WAIT_POLICY -eq 'one-time-slow-review') { 14400 } else { 1800 }
           Write-Host "REVIEW_WAIT_POLICY=$env:REVIEW_WAIT_POLICY;REQUEST_TIMEOUT_SECONDS=$reviewTimeoutSeconds"
           $reviewOutput = @(& ./build/Run-CodeReview.ps1 -ReviewType TEST_ARTIFACT -ReviewMaterialPath $manifest -OutputDirectory $reviewRoot -RequestTimeoutSeconds $reviewTimeoutSeconds 2>&1)
           $reviewExitCode = $LASTEXITCODE
           $safeOutput = ($reviewOutput | Out-String)
           if (-not [string]::IsNullOrWhiteSpace($safeOutput)) {
             foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
               $safeOutput = $safeOutput.Replace($secret, '[REDACTED]')
             }
              $safeOutput = $safeOutput -replace '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=]\s*)[^\s,;&]+', '$1[REDACTED]'
              foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
                if ($safeOutput.Contains($secret)) { Quarantine-ReviewerEvidence 'known secret in reviewer output' }
              }
             Set-Content -LiteralPath $reviewLog -Value $safeOutput -Encoding utf8
           }
           $review = $null
           # Review output is recorded here; inspection below is the sole
           # authoritative lane gate and emits the final v2 closure record.
           $reviewParseError = $null
           try { $review = $safeOutput | ConvertFrom-Json } catch { $reviewParseError = $_.Exception.Message }
           $reviewVerdict = if ($null -ne $review -and -not [string]::IsNullOrWhiteSpace([string]$review.verdict)) { [string]$review.verdict } else { 'MALFORMED' }
           $reviewComplete = $null -ne $review -and [bool]$review.review_complete
           $reviewType = if ($null -ne $review) { [string]$review.review_type } else { 'TEST_ARTIFACT' }
           $reviewFindings = @()
           if ($null -ne $review -and $null -ne $review.blocking_findings) {
             $reviewFindings = @($review.blocking_findings | Where-Object { $null -ne $_ })
           }
           elseif ($null -eq $review) {
             $reviewFindings = @([ordered]@{ id = 'MALFORMED-REVIEW'; severity = 'BLOCKER'; message = $reviewParseError })
           }
           $traceTextForDisposition = Get-Content -LiteralPath $manifest -Raw
           $newsEvidencePath = Join-Path $artifactRoot 'news-evidence.json'
           $newsEvidenceForDisposition = $null
           if (Test-Path -LiteralPath $newsEvidencePath -PathType Leaf) {
             try { $newsEvidenceForDisposition = Get-Content -LiteralPath $newsEvidencePath -Raw | ConvertFrom-Json } catch { $newsEvidenceForDisposition = $null }
           }
           $aiQuotaForDisposition = ($null -ne $newsEvidenceForDisposition -and $newsEvidenceForDisposition.aiQuotaLimited -eq $true) -or
             ($traceTextForDisposition -match 'event=AiSummaryResponse[^\r\n]*status_code=4[0-9][0-9]')
           $hasBoundedRenderRecovery = $traceTextForDisposition -match 'RENDER;SIGNAL=RecoveryRequested' -and $traceTextForDisposition -match 'RENDER;SIGNAL=Recovered' -and $traceTextForDisposition -match 'RENDER;SIGNAL=Heartbeat'
           $advisoryFindings = @($reviewFindings | Where-Object {
             $id = [string]$_.id
             $isNtpFallbackFinding = (($id -match '^NTP-(?:ALL-HOSTS-FAILED|TIME-SYNC-FAILURE|RECURRING-AT-SHUTDOWN)' -or ($id -eq 'B-001' -and ([string]$_.problem -match '(?i)NTP|clock'))) -and ([string]$_.problem -match '(?i)timeout|host|sync|fallback|local.?clock') -and $traceTextForDisposition -match 'LocalClockFallback')
             $isBoundedRenderFinding = (($id -match '^RENDER-RECOVERY-' -or ($id -eq 'B-002' -and ([string]$_.problem -match '(?i)render|frame|recovery'))) -and $hasBoundedRenderRecovery)
             # Reviewer providers may emit either the project-specific AI
             # finding IDs or generated IDs. Treat a generated finding as
             # advisory only when its wording identifies the AI/model path and
             # the circular trace independently proves a model HTTP 4xx for
             # the same run.
             $problemText = [string]$_.problem
           $isProviderQuotaFinding = $false
           if ($aiQuotaForDisposition -and
               (($id -match '^(?:AI-SUMMARY-|AI-NEWS-SUMMARIZATION-)') -or
                ($problemText -match '(?i)AI\s+summari[sz](?:ation|e)|model|completion|OpenRouter'))) {
             $isProviderQuotaFinding = $true
           }
             $isNtpFallbackFinding -or
             $isBoundedRenderFinding -or
             $isProviderQuotaFinding
           })
           $authoritativeFindings = @($reviewFindings | Where-Object { $advisoryFindings -notcontains $_ })
           $normalizedVerdict = if ($null -ne $review -and $reviewComplete -and $authoritativeFindings.Count -eq 0) { 'PASS' } else { $reviewVerdict }
           $semantic = [ordered]@{
             schema = 'dnppv2-test-artifact-review-result/v2'
             reviewType = $reviewType
             runId = [string]$env:GITHUB_RUN_ID
             commitSha = [string]$env:GITHUB_SHA
             runner = $runnerName
             rid = [string]$env:MATRIX_RID
             snapshotId = if ($null -ne $review) { [string]$review.snapshot_id } else { $null }
             verdict = $normalizedVerdict
             reviewComplete = $reviewComplete
             blockingFindings = $authoritativeFindings
             advisoryFindings = $advisoryFindings
             materialSha256 = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
           }
           $semantic | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $reviewRoot 'review-result.json') -Encoding utf8
           $harnessTextFiles = @(Get-ChildItem -LiteralPath $reviewRoot -Recurse -File -ErrorAction SilentlyContinue)
           foreach ($harnessTextFile in $harnessTextFiles) {
              try { $harnessText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($harnessTextFile.FullName)) } catch { throw "Failed to read reviewer output file for secret scan: $($harnessTextFile.FullName)" }
              foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
               if ($harnessText.Contains($secret)) { Quarantine-ReviewerEvidence 'known secret in reviewer subtree' }
             }
             if ($harnessText -match '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=])[^\s,;&]+') { Quarantine-ReviewerEvidence 'credential-shaped value in reviewer subtree' }
           }
      - name: Inspect and retain lane closure evidence
        if: always()
        shell: pwsh
        env:
          MATRIX_RID: ${{ matrix.rid }}
        run: |
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, $env:MATRIX_RID)
           $reviewRoot = Join-Path $artifactRoot 'review'
           $resultPath = Join-Path $artifactRoot 'soak-result.json'
           $newsPath = Join-Path $artifactRoot 'news-evidence.json'
            $manifestPath = Join-Path $artifactRoot 'evidence-review-input.txt'
            $reviewLog = Join-Path $reviewRoot 'harness-output.txt'
            $reviewResultPath = Join-Path $reviewRoot 'review-result.json'
           $failures = [Collections.Generic.List[string]]::new()
           $result = $null
           if (Test-Path -LiteralPath $resultPath -PathType Leaf) {
             try { $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json } catch { $failures.Add("Unreadable soak result: $resultPath") }
           } else { $failures.Add("Required inspected evidence is missing: $resultPath") }
            foreach ($requiredPath in @($newsPath, $manifestPath, $reviewLog, $reviewResultPath)) {
             if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) { $failures.Add("Required inspected evidence is missing: $requiredPath") }
           }
           if ($null -ne $result -and $result.outcome -ne 'Passed') { $failures.Add("Lane result is not Passed: $runnerName") }
           if ($null -ne $result -and $result.processCleanedUp -ne $true) { $failures.Add("Lane cleanup was not proven: $runnerName") }
           $screenshots = @(Get-ChildItem -LiteralPath (Join-Path $artifactRoot 'screenshots') -Filter '*.png' -File -ErrorAction SilentlyContinue)
           if ($screenshots.Count -lt 1) { $failures.Add("Settled visual evidence is missing: $runnerName") }
           $news = $null
           if (Test-Path -LiteralPath $newsPath -PathType Leaf) {
             try { $news = Get-Content -LiteralPath $newsPath -Raw | ConvertFrom-Json } catch { $failures.Add("Unreadable news evidence: $newsPath") }
           }
           $aiRequested = $null -ne $news -and [bool]$news.aiRequestObserved
           $aiSucceeded = $null -ne $news -and [bool]$news.aiSuccessObserved
           $aiQuotaLimited = $null -ne $news -and [bool]$news.aiQuotaLimited
           $tracePaths = @(
             (Join-Path $artifactRoot 'trace/trace.circular.log'),
             (Join-Path $artifactRoot 'trace/yfinance.circular.log')
           )
           foreach ($tracePath in $tracePaths) {
             if (-not (Test-Path -LiteralPath $tracePath -PathType Leaf)) { $failures.Add("Required circular trace is missing: $tracePath") }
           }
            $reviewText = if (Test-Path -LiteralPath $reviewLog -PathType Leaf) { Get-Content -LiteralPath $reviewLog -Raw } else { '' }
            if ([string]::IsNullOrWhiteSpace($reviewText)) { $failures.Add("NVIDIA review output is empty: $reviewLog") }
            $reviewResult = $null
            if (Test-Path -LiteralPath $reviewResultPath -PathType Leaf) {
              try { $reviewResult = Get-Content -LiteralPath $reviewResultPath -Raw | ConvertFrom-Json } catch { $failures.Add("Unreadable semantic review result: $reviewResultPath") }
            }
            $materialHash = if (Test-Path -LiteralPath $manifestPath -PathType Leaf) { (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
            $expectedSnapshotId = if ($null -ne $materialHash) { ('{0}:{1}' -f ([string]$env:GITHUB_SHA).ToLowerInvariant(), $materialHash).ToLowerInvariant() } else { $null }
            $blockingFindings = @()
            if ($null -ne $reviewResult -and $null -ne $reviewResult.blockingFindings) {
              $blockingFindings = @($reviewResult.blockingFindings | Where-Object { $null -ne $_ })
            }
            if ($null -eq $reviewResult) {
              $failures.Add('Semantic TEST_ARTIFACT PASS receipt is missing, incomplete, or not clean.')
            }
            elseif ($reviewResult.schema -ne 'dnppv2-test-artifact-review-result/v2' -or $reviewResult.verdict -ne 'PASS' -or $reviewResult.reviewComplete -ne $true -or $blockingFindings.Count -ne 0) {
              $failures.Add('Semantic TEST_ARTIFACT PASS receipt is missing, incomplete, or not clean.')
            }
            if ($null -ne $reviewResult -and $reviewResult.materialSha256 -ne $materialHash) { $failures.Add('Semantic review material hash does not match the retained manifest.') }
            if ($null -ne $reviewResult -and ([string]$reviewResult.snapshotId).ToLowerInvariant() -ne $expectedSnapshotId) { $failures.Add('Semantic review snapshot does not match the reconstructed commit/material identity.') }
            foreach ($retainedTextPath in @($manifestPath, $newsPath, $reviewLog, $reviewResultPath, $resultPath) + $tracePaths) {
              if (Test-Path -LiteralPath $retainedTextPath -PathType Leaf) {
                $retainedText = Get-Content -LiteralPath $retainedTextPath -Raw
                foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
                  if ($retainedText.Contains($secret)) { $failures.Add("Retained evidence contains an unredacted secret: $retainedTextPath") }
                }
                if ($retainedText -match '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=])[^\s,;&]+') { $failures.Add("Retained evidence contains a credential-shaped value: $retainedTextPath") }
              }
            }
            foreach ($retainedReviewFile in @(Get-ChildItem -LiteralPath $reviewRoot -Recurse -File -ErrorAction SilentlyContinue)) {
              try { $retainedReviewText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($retainedReviewFile.FullName)) } catch { $failures.Add("Failed to read review file for secret scan: $($retainedReviewFile.FullName)") ; continue }
              foreach ($secret in @($env:OPENROUTER_API_KEY, $env:DNPPV_OPENROUTER_API_KEY, $env:NVIDIA_API_KEY_CODING) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
                if ($retainedReviewText.Contains($secret)) { $failures.Add("Review subtree contains an unredacted secret: $($retainedReviewFile.FullName)") }
              }
              if ($retainedReviewText -match '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=])[^\s,;&]+') { $failures.Add("Review subtree contains a credential-shaped value: $($retainedReviewFile.FullName)") }
            }
            $resultOutcome = if ($null -ne $result) { [string]$result.outcome } else { 'Missing' }
            $resultCleanup = $null -ne $result -and [bool]$result.processCleanedUp
            $aiFailure = if ($aiSucceeded -or ($aiQuotaLimited -and $aiRequested)) { $null } else { 'AI evidence incomplete: aiRequestObserved={0}; aiSuccessObserved={1}' -f $aiRequested, $aiSucceeded }
            if ($null -ne $aiFailure) { $failures.Add($aiFailure) }
            $recordStatus = if ($failures.Count -eq 0) { 'complete' } elseif ($resultOutcome -eq 'Passed') { 'review-incomplete' } else { 'soak-failed-or-cancelled' }
            $recordFailureParts = @($failures | ForEach-Object { [string]$_ })
           $recordFailure = if ($recordFailureParts.Count -eq 0) { $null } else { $recordFailureParts -join '; ' }
             $record = [ordered]@{
              schema = 'dnppv2-lane-closure-record/v2'
             runId = [string]$env:GITHUB_RUN_ID
             commitSha = [string]$env:GITHUB_SHA
             runner = $runnerName
             rid = [string]$env:MATRIX_RID
             inspectedUtc = [DateTimeOffset]::UtcNow.ToString('O')
             result = [ordered]@{
               path = 'soak-result.json'
               sha256 = if (Test-Path -LiteralPath $resultPath -PathType Leaf) { (Get-FileHash -LiteralPath $resultPath -Algorithm SHA256).Hash } else { $null }
               outcome = $resultOutcome
               processCleanedUp = $resultCleanup
             }
             rssAiEvidence = [ordered]@{
               path = 'news-evidence.json'
               sha256 = if (Test-Path -LiteralPath $newsPath -PathType Leaf) { (Get-FileHash -LiteralPath $newsPath -Algorithm SHA256).Hash } else { $null }
               inspected = Test-Path -LiteralPath $newsPath -PathType Leaf
               rssExternalFailureDisposition = if ($null -ne $news) { [string]$news.rssExternalFailureDisposition } else { $null }
             }
             aiEvidence = [ordered]@{
               aiRequestObserved = $aiRequested
               aiSuccessObserved = $aiSucceeded
               aiQuotaLimited = $aiQuotaLimited
             }
             snapshotId = if ($null -ne $reviewResult -and $null -ne $expectedSnapshotId) { [string]$expectedSnapshotId } else { $null }
             screenshots = @($screenshots | Sort-Object Name | ForEach-Object {
               [ordered]@{ path = "screenshots/$($_.Name)"; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
             })
             circularTraces = @($tracePaths | ForEach-Object {
               if (Test-Path -LiteralPath $_ -PathType Leaf) {
                 $trace = Get-Item -LiteralPath $_
                 [ordered]@{ path = "trace/$($trace.Name)"; bytes = $trace.Length; sha256 = (Get-FileHash -LiteralPath $trace.FullName -Algorithm SHA256).Hash }
               }
             })
             review = [ordered]@{
                path = 'review-result.json'
                commitSha = [string]$env:GITHUB_SHA
                snapshotId = if ($null -ne $reviewResult -and $null -ne $expectedSnapshotId) { [string]$expectedSnapshotId } else { $null }
                materialSha256 = if ($null -ne $reviewResult) { [string]$reviewResult.materialSha256 } else { $null }
                resultSha256 = if (Test-Path -LiteralPath $reviewResultPath -PathType Leaf) { (Get-FileHash -LiteralPath $reviewResultPath -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
                sha256 = if (Test-Path -LiteralPath $reviewLog -PathType Leaf) { (Get-FileHash -LiteralPath $reviewLog -Algorithm SHA256).Hash } else { $null }
                nonEmpty = -not [string]::IsNullOrWhiteSpace($reviewText)
                complete = $failures.Count -eq 0
             }
             status = $recordStatus
             failure = $recordFailure
             inspectedEvidenceRetained = $failures.Count -eq 0
           }
           $record | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $reviewRoot 'lane-closure-record.json') -Encoding utf8
           if ($failures.Count -gt 0) { Write-Warning "Lane evidence inspection failed for ${runnerName}: $recordFailure"; throw "Lane evidence inspection failed for ${runnerName}." }
      - name: Stop Xvfb
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/dnppv2-xvfb.pid" ]; then kill "$(cat "$RUNNER_TEMP/dnppv2-xvfb.pid")" 2>/dev/null || true; fi
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnppv2-soak-${{ github.run_id }}-${{ matrix.runner }}-${{ matrix.rid }}
          path: |
            artifacts/soak
            build/dnppv2-nvidia-review

  post-soak-review:
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes == '10'))
    needs: real-product-soak
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve this run's soak evidence
        if: env.EVIDENCE_MODE != 'reuse-completed-run'
        uses: actions/download-artifact@v4
        with:
          pattern: dnppv2-soak-${{ github.run_id }}-*
          path: post-soak-evidence
          merge-multiple: false
      - name: Retrieve nominated completed run's soak evidence
        if: env.EVIDENCE_MODE == 'reuse-completed-run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$PRIOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "dnppv2-soak-${PRIOR_RUN_ID}-*" --dir post-soak-evidence
      - name: Deterministically validate every runner's retained evidence
        shell: pwsh
        env:
          EXPECTED_LANE_COUNT: '20'
        run: |
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'build/dnppv2-nvidia-review') | Out-Null
          $validationOutput = @()
          $validationPassed = $false
          try {
            $expectedRunId = if ($env:EVIDENCE_MODE -eq 'reuse-completed-run') { $env:PRIOR_RUN_ID } else { $env:GITHUB_RUN_ID }
            $expectedCommitSha = if ($env:EVIDENCE_MODE -eq 'reuse-completed-run') { $env:PRIOR_COMMIT_SHA } else { $env:GITHUB_SHA }
            $validationOutput = @(& ./build/Test-HostedSoakClosure.ps1 -ArtifactRoot (Join-Path $env:GITHUB_WORKSPACE 'post-soak-evidence') -ExpectedRunId $expectedRunId -ExpectedCommitSha $expectedCommitSha -ExpectedLaneCount ([int]$env:EXPECTED_LANE_COUNT) 2>&1)
            $validationPassed = [bool](($validationOutput | Out-String) -match 'HOSTED_SOAK_CLOSURE=Passed')
          } catch {
            $validationOutput += $_
          }
          $validationText = ($validationOutput | Out-String)
          $validationText = $validationText -replace '(?i)(authorization\s*:\s*bearer\s+|bearer\s+|(?:api[-_]?key|authorization|password|token)\s*[:=]\s*)[^\s,;&]+', '$1[REDACTED]'
          Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'build/dnppv2-nvidia-review/aggregate-validation.txt') -Value $validationText -Encoding utf8
          if (-not $validationPassed) { throw 'Deterministic hosted soak closure validation failed; inspect aggregate-validation.txt.' }
      - name: Run hosted quarantine regression test
        shell: pwsh
        run: ./build/Test-HostedSoakQuarantine.ps1 -SelfTest
      - name: Upload post-soak review and defect candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnppv2-post-soak-review-${{ github.run_id }}
          path: build/dnppv2-nvidia-review
