name: Cross-platform publish matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Real-product soak duration in minutes (5, 10, 30, 60, 120, or 240)'
        required: true
        default: '5'
        type: choice
        options: ['5', '10', '30', '60', '120', '240']

permissions:
  contents: read

jobs:
  publish:
    concurrency:
      group: dnppv2-publish-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-2025-vs2026
            rid: win-x64
          - runner: windows-2022
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-26.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-26.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-26-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: macos-26
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained bundle
        run: dotnet publish src/DoNotPanicPortfolioVisualizer.App/DoNotPanicPortfolioVisualizer.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: dnppv2-${{ matrix.runner }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

  real-product-soak:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 370
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-2025-vs2026
            rid: win-x64
          - runner: windows-2022
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-26.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-26.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-26-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: macos-26
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    env:
      DNPPV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DNPPV_SOAK_REQUIRE_AI_NEWS: '1'
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test the real product
        run: |
          dotnet build DoNotPanicPortfolioVisualizer.sln --configuration Release
          dotnet test DoNotPanicPortfolioVisualizer.sln --configuration Release --no-build --logger "console;verbosity=minimal"
      - name: Publish the real product
        run: dotnet publish src/DoNotPanicPortfolioVisualizer.App/DoNotPanicPortfolioVisualizer.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - name: Start Xvfb for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/dnppv2-xvfb.pid"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Run real-product soak and collect circular trace
        shell: pwsh
        env:
          DNPPV_SOAK_DURATION_MINUTES: ${{ inputs.soak_minutes || '5' }}
        run: |
           $runnerName = '${{ matrix.runner }}'
           $artifactRoot = Join-Path $PWD ('artifacts/soak/{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $runnerName, '${{ matrix.rid }}')
           $screenshotPath = Join-Path $artifactRoot 'screenshots'
           $exeName = if ($IsWindows) { 'DoNotPanicPortfolioVisualizer.App.exe' } else { 'DoNotPanicPortfolioVisualizer.App' }
           $exe = Join-Path $PWD ('artifacts/${{ matrix.rid }}/{0}' -f $exeName)
           ./build/Invoke-ProductSoak.ps1 -ExecutablePath $exe -DurationMinutes ([int]$env:DNPPV_SOAK_DURATION_MINUTES) -ArtifactRoot $artifactRoot -ScreenshotPath $screenshotPath -ScreenshotIntervalMinutes 30
           $screenshots = @(Get-ChildItem -LiteralPath $screenshotPath -Filter '*.png' -File -ErrorAction SilentlyContinue)
           $expectedScreenshotCount = [Math]::Floor((([int]$env:DNPPV_SOAK_DURATION_MINUTES * 60) - 30) / 1800) + 1
           if ($screenshots.Count -lt $expectedScreenshotCount) { throw "Expected at least $expectedScreenshotCount settled screenshots, found $($screenshots.Count)." }
           $manifest = Join-Path $artifactRoot 'evidence-review-input.txt'
           @(
             "run_id=$env:GITHUB_RUN_ID"
             "runner=$runnerName"
             "rid=${{ matrix.rid }}"
             (Get-Content -Raw (Join-Path $artifactRoot 'soak-result.json'))
             "screenshot=$screenshotPath"
             "expected_screenshot_count=$expectedScreenshotCount"
             'screenshots:'
             ($screenshots | Sort-Object Name | ForEach-Object {
                 $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                 "screenshot_file=$($_.Name);bytes=$($_.Length);sha256=$hash"
             })
             'trace_files:'
             (Get-ChildItem -LiteralPath (Join-Path $artifactRoot 'trace') -File -ErrorAction SilentlyContinue | ForEach-Object {
                 $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                 $content = [IO.File]::ReadAllText($_.FullName)
                 $excerpt = if ($content.Length -le 40000) { $content } else { $content.Substring(0, 20000) + "`n[TRACE_EXCERPT_OMITTED]`n" + $content.Substring($content.Length - 20000) }
                 "trace_file=$($_.Name);bytes=$($_.Length);sha256=$hash`n$excerpt"
             })
           ) | Set-Content -LiteralPath $manifest -Encoding utf8
           if ([string]::IsNullOrWhiteSpace($env:DEEPSEEK_API_KEY)) { throw 'DEEPSEEK_API_KEY is required for soak artifact review.' }
           ./build/Invoke-DeepSeekReviewHarness.ps1 -ReviewType TEST_ARTIFACT -ReviewMaterialPath $manifest -OutputDirectory ('build/deepseek-review/soak-{0}-{1}' -f $env:GITHUB_RUN_ID, $runnerName)
      - name: Stop Xvfb
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/dnppv2-xvfb.pid" ]; then kill "$(cat "$RUNNER_TEMP/dnppv2-xvfb.pid")" 2>/dev/null || true; fi
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnppv2-soak-${{ github.run_id }}-${{ matrix.runner }}-${{ matrix.rid }}
          path: |
            artifacts/soak
            build/deepseek-review

  post-long-soak-review:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.soak_minutes == '240'
    needs: real-product-soak
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait ten minutes for post-soak settling
        shell: bash
        run: sleep 600
      - name: Retrieve this run's soak evidence
        uses: actions/download-artifact@v4
        with:
          pattern: dnppv2-soak-${{ github.run_id }}-*
          path: post-soak-evidence
          merge-multiple: false
      - name: Review every runner's traces and evidence
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem -LiteralPath post-soak-evidence -Recurse -Filter 'evidence-review-input.txt' -File)
          if ($manifests.Count -ne 18) { throw "Expected 18 soak evidence manifests, found $($manifests.Count)." }
          $failures = [Collections.Generic.List[string]]::new()
          foreach ($manifest in $manifests | Sort-Object FullName) {
            $material = Get-Content -LiteralPath $manifest.FullName -Raw
            if ($material -notmatch 'Ai(?:Summary|AccessValidation)') {
              $failures.Add("AI trace evidence is absent: $($manifest.FullName)")
            }
            $reviewRoot = Join-Path $PWD ('post-soak-review/{0}' -f $manifest.Directory.Name)
            ./build/Invoke-DeepSeekReviewHarness.ps1 -ReviewType TEST_ARTIFACT -ReviewMaterialPath $manifest.FullName -OutputDirectory $reviewRoot
          }
          if ($failures.Count -gt 0) {
            New-Item -ItemType Directory -Force -Path post-soak-review | Out-Null
            $failures | Set-Content -LiteralPath post-soak-review/defect-candidates.txt -Encoding utf8
            throw ($failures -join "`n")
          }
      - name: Upload post-soak review and defect candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnppv2-post-soak-review-${{ github.run_id }}
          path: post-soak-review
